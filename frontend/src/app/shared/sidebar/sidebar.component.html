<aside class="sidebar">
  <nav class="sidebar-nav">
    <a *ngFor="let item of navItems"
       [routerLink]="item.path"
       routerLinkActive="active"
       class="nav-item">
      <span class="nav-icon">{{ item.icon }}</span>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>
  <div *ngIf="selectedBorrower" class="borrower-context">
    <div>Viewing: <strong>{{ selectedBorrower.fullName }}</strong> (ID: {{ selectedBorrower.nationalId }})</div>
    <button (click)="changeBorrower()">Change Borrower</button>
  </div>
</aside>
